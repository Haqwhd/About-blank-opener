<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Pitch Shifter (Crisper)</title>
<script src="https://cdn.jsdelivr.net/npm/tone@latest/build/Tone.min.js"></script>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 50px; }
  input { width: 300px; }
  button { font-size: 16px; padding: 10px 20px; margin-top: 20px; }
</style>
</head>
<body>
<h1>Live Pitch Shifter (Crisper)</h1>
<label>Pitch Shift (semitones):
  <input type="range" id="pitchSlider" min="-12" max="12" value="0" step="0.1">
  <span id="pitchValue">0</span>
</label>
<br><br>
<button id="startButton">Start Mic</button>

<script>
const pitchSlider = document.getElementById('pitchSlider');
const pitchValue = document.getElementById('pitchValue');
const startButton = document.getElementById('startButton');

let mic, pitchShift;

async function startPitchShifter() {
    await Tone.start(); // Browser requires user gesture to start audio
    mic = new Tone.UserMedia();
    await mic.open();

    // Smaller windowSize makes it crisper
    pitchShift = new Tone.PitchShift({
        pitch: parseFloat(pitchSlider.value),
        windowSize: 0.05, // smaller = crisper
        delayTime: 0,
        feedback: 0
    }).toDestination();

    mic.connect(pitchShift);

    startButton.disabled = true;
    startButton.textContent = "Mic Active 🎤";
}

startButton.onclick = startPitchShifter;

pitchSlider.oninput = () => {
    pitchValue.textContent = pitchSlider.value;
    if (pitchShift) pitchShift.pitch = parseFloat(pitchSlider.value);
};
</script>
</body>
</html>

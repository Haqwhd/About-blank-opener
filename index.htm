<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About:Blank Opener</title>
    <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
        body {
        text-align: center;
    }
  </style>
  <style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        font-size: clamp(16px, 2.5vw, 24px);
        padding: 20px;
        box-sizing: border-box;
    }

    h1 {
        font-size: clamp(28px, 5vw, 48px);
        margin-bottom: 30px;
    }

    input {
        width: min(500px, 80vw) !important;
        padding: 15px !important;
        font-size: clamp(16px, 2.2vw, 22px);
        box-sizing: border-box;
    }

    button {
        font-size: clamp(16px, 2.2vw, 22px);
        padding: 12px 20px;
        margin: 5px;
        cursor: pointer;
    }

    p {
        margin: 15px 0 8px;
    }
</style>
</head>
<body>

    <h1>Enter a URL to open in an iframe!</h1>
    
    <input type="text" id="urlInput" placeholder='Example: "example.com"' style="width: 300px; padding: 5px;">
    <button onclick="launchUserUrl()">Open Website</button>
    
    <p>Presets:</p>
    
    <p>Games</p>
    
    <button onclick="create('https://krunker.io')">Krunker.io</button>
    
    <button onclick="create('https://www.onlinegames.io')">OnlineGames io</button>

  	<button onclick="create('https://gold-static.pages.dev')">Vertex Gold</button>
	
    <button onclick="create('https://calcsolver.net')">More games</button>
  
    <button onclick="create('https://nirbytessubyt-bfjey.azure-cost-estimator.se/')">Velara</button>
  
    <button onclick="create('https://sandstrike.io')">Ferge/Sandstrike</button>
  
    <p>Useful Sites</p>
    
    <button onclick="create('https://en.wikipedia.org')">Wikipedia</button>
    
    <button onclick="create('https://www.britannica.com/')">Encyclopedia Britannica</button>
    
    <p>Maybe another category coming soon...</p>
    
    <script>
        //url opener from address bar function
        function launchUserUrl() {
            var inputUrl = document.getElementById('urlInput').value.trim();

            if (!inputUrl) {
                alert("Please enter a URL first.");
                return;
            }

            //makes it so there always is https:// at begining
            if (!inputUrl.startsWith('http://') && !inputUrl.startsWith('https://')) {
                inputUrl = 'https://' + inputUrl;
            }
            
            create(inputUrl);
        }
        
        document.getElementById("urlInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                launchUserUrl();
            }
        });

        //actual aboutblank opener
       function create(url) {
  var win = window.open();
  
  //popup blocker checker
  if (!win) {
    alert("Popup blocked! Please allow popups for this site.");
    return;
  }
		   
  // ---> NEW: Add the close warning to the newly opened tab <---
  win.addEventListener('beforeunload', function (e) {
    e.preventDefault();
    e.returnValue = ''; // Standard trigger for modern browsers
  });
		   
  win.document.body.style.margin = '0';
  win.document.body.style.height = '100vh';
				   win.document.title = 'My Custom Tab!';
           
  var iframe = win.document.createElement('iframe');
           
           iframe.style.border = 'none';
				   iframe.style.width = '100vw';
           iframe.style.height = '100vh';
           iframe.style.margin = '0';
           iframe.src = url;
				   iframe.setAttribute('allowfullscreen', 'true');
				   iframe.setAttribute('allow', 'fullscreen');
				 

  win.document.body.appendChild(iframe);
}
    </script>
<script>
  // This triggers when the user tries to close the tab or navigate away
  window.addEventListener('beforeunload', function (e) {
    // Requires a user interaction on the page first (e.g., clicking anywhere)
    e.preventDefault();
    e.returnValue = ''; // Standard trigger for modern browsers
  });
</script>
</body>
</html>

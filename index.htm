<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About:Blank Opener</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 5vh 5vw;
        }

        h1 {
            font-size: clamp(28px, 4vw, 48px);
            margin: 0 0 25px;
        }

        #urlInput {
            width: min(600px, 70vw);
            padding: 14px;
            font-size: clamp(16px, 2vw, 22px);
        }

        .open-button {
            font-size: clamp(16px, 2vw, 22px);
            padding: 14px 22px;
            margin: 5px;
            cursor: pointer;
        }

        .category {
            margin-top: 30px;
        }

        .category-title {
            font-size: clamp(20px, 2.5vw, 28px);
            margin-bottom: 10px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 1100px;
            margin: auto;
        }

        .buttons button {
            font-size: clamp(16px, 1.8vw, 21px);
            padding: 12px 20px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 15px;
            }

            #urlInput {
                width: 90vw;
            }

            .open-button {
                display: block;
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>

    <h1>Enter a URL to open in an iframe!</h1>

    <div>
        <input type="text" id="urlInput" placeholder='Example: "example.com"'>
        <button class="open-button" onclick="launchUserUrl()">Open Website</button>
    </div>

    <div class="category">
        <p class="category-title">Cloaker 🤫</p>

        <div class="buttons">
            <button onclick="create('https://haqwhd.github.io/About-blank-opener/')">Cloak about:blank opener</button>
        </div>
    </div>

    <div class="category">
        <p class="category-title">Games</p>

        <div class="buttons">
            <button onclick="create('https://krunker.io')"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMt-BJ3x6UsQWJadcGFzo_srDypl-o6s6HUZ8-FrhD9YbiA_dM1LkOlLj3fc2eOMOF7uEQhxgs4ERPyz0zL_I8mqhI30jBEa0M2L-GEc8AVg&amp;s=10" width="50"> Krunker.io</button>
            
            <button onclick="create('https://www.onlinegames.io')"><img src="https://www.onlinegames.io/media/posts/1323/responsive/thumbs-xs.webp" width="50"> OnlineGames io</button>
            
            <button onclick="create('https://gold-static.pages.dev')">Vertex Gold (doesn't work)</button>
            <button onclick="create('https://calcsolver.net')">More games</button>
            <button onclick="create('https://nirbytessubyt-bjfey.azure-cost-estimator.se/')">Velara (might work, idrk)</button>
            
            <button onclick="create('https://sandstrike.io')"><img src="https://sandstrike.io/logo.png" width="50"> Ferge/Sandstrike</button>
            
            <button onclick="create('https://onlinegames.com')">OnlineGames com</button>
            <button onclick="create('https://haqwhd.github.io/About-blank-opener/chat.html')">Live Chatroom</button>
            
            <button onclick="create('https://geometrylitepc.net')"><img src="https://geometrylitepc.net/data/image/options/geometrydashlite-game-image.png" width="50"> GeometryGames</button>
            
            <button onclick="create('https://blooket.com')"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7pw41rnOjRYr06B9U0Fy2IUoGu4PaHEmx0qb4AroyVw&amp;s=10" width="90"></button>
            
            <button onclick="create('https://smashkarts.io')"><img src="https://smashkarts.io/images/smashkarts.png" width="80"></button>
            
            <button onclick="create('https://bloxd.io')"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSK1nIg0HojmjeOkVMsSfG0fL79JxOwnvv6vF8Srt0yA&amp;s=10" width="70"> Minecraft clone</button>
            
            <button onclick="create('https://eaglercraftgame.io')"><img src="https://eaglercraftgame.io/cache/data/image/game/eaglercraft-game-m160x96.jpg" width="80"> Literal Minecraft</button>
        </div>
    </div>

    <div class="category">
        <p class="category-title">Useful Sites</p>

        <div class="buttons">
            <button onclick="create('https://en.wikipedia.org')">Wikipedia</button>
            <button onclick="create('https://www.britannica.com/')">Encyclopedia Britannica</button>
        </div>
    </div>

    <p>Maybe another category coming soon...</p>

    <script>
        // URL opener from address bar
        function launchUserUrl() {
            var inputUrl = document.getElementById('urlInput').value.trim();

            if (!inputUrl) {
                alert("Please enter a URL first.");
                return;
            }

            // Makes it so there always is https:// at beginning
            if (!inputUrl.startsWith('http://') && !inputUrl.startsWith('https://')) {
                inputUrl = 'https://' + inputUrl;
            }

            create(inputUrl);
        }

        document.getElementById("urlInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                launchUserUrl();
            }
        });

        // Actual about:blank opener
        function create(url) {
            var win = window.open();

            // Popup blocker checker
            if (!win) {
                alert("Popup blocked! Please allow popups for this site.");
                return;
            }

            // Add close warning to newly opened tab
            win.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '';
            });

            win.document.body.style.margin = '0';
            win.document.body.style.height = '100vh';
            win.document.title = 'Frick GoGuardian';

            var iframe = win.document.createElement('iframe');

            iframe.style.border = 'none';
            iframe.style.width = '100vw';
            iframe.style.height = '100vh';
            iframe.style.margin = '0';
            iframe.src = url;
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.setAttribute('allow', 'fullscreen');

            win.document.body.appendChild(iframe);
        }
    </script>

    <script>
        //final browser filter bypasser
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
        });
    </script>

</body>
</html>

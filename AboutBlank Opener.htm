<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Single-File App</title>
</head>
<body>

    <h1>Enter a URL to open in an iframe</h1>
    
    <!-- 1. The Input Field (Press Enter or Click Button) -->
    <input type="text" id="urlInput" placeholder="https://example.com" style="width: 300px; padding: 5px;">
    <button onclick="launchUserUrl()">Open Website</button>

    <script>
        // 2. This grabs the text, adds 'https://' if needed, and calls create()
        function launchUserUrl() {
            var inputUrl = document.getElementById('urlInput').value.trim();

            if (!inputUrl) {
                alert("Please enter a URL first.");
                return;
            }

            // Automatically add https:// if the user forgets it
            if (!inputUrl.startsWith('http://') && !inputUrl.startsWith('https://')) {
                inputUrl = 'https://' + inputUrl;
            }
            
            create(inputUrl);
        }

        // 3. This listens for the 'Enter' key inside the input box
        document.getElementById("urlInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                launchUserUrl();
            }
        });

        // 4. The actual function that opens the new tab and iframe
       function create(url) {
  var win = window.open();
  
  // if browser blocks it, win will be null
  if (!win) {
    alert("Popup blocked! Please allow popups for this site.");
    return;
  }

  win.document.body.style.margin = '0';
  win.document.body.style.height = '100vh';

  var iframe = win.document.createElement('iframe');
  iframe.style.border = 'none';
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.margin = '0';
  iframe.src = url;

  win.document.body.appendChild(iframe);
}
    </script>
</body>
</html>
